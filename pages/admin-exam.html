<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Exam Editor — Drix Admin</title>
<link rel="stylesheet" href="/css/style.css"/>
<style>
.q-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:20px;margin-bottom:14px;position:relative;}
.q-num{font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--brand-secondary);margin-bottom:10px;}
.option-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.option-label{width:28px;height:28px;border-radius:50%;background:var(--surface2);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:700;flex-shrink:0;cursor:pointer;transition:var(--trans);}
.option-label.correct{background:rgba(6,214,160,0.15);border-color:rgba(6,214,160,0.4);color:var(--brand-accent);}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
  <div class="sidebar-logo">DRIX Admin<span>Management Portal</span></div>
  <nav class="sidebar-nav">
    <div class="sidebar-section-label">Overview</div>
    <a href="/admin/dashboard" class="sidebar-link"><span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span>Dashboard</a>
    <a href="/admin/fellows" class="sidebar-link"><span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></span>Fellows</a>
    <a href="/admin/mentors" class="sidebar-link"><span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>Mentors</a>
    <a href="/admin/checkins" class="sidebar-link"><span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span>Check-ins</a>
    <div class="sidebar-section-label">Content</div>
    <a href="/admin/courses" class="sidebar-link active"><span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>Tracks & Modules</a>
    <a href="/admin/cohorts" class="sidebar-link"><span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>Cohorts</a>
    <a href="/admin/announcements" class="sidebar-link"><span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg></span>Announcements</a>
    <a href="/admin/submissions" class="sidebar-link"><span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span>Submissions</a>
    <a href="/admin/blog" class="sidebar-link"><span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>Blog</a>
    <a href="/admin/certificates" class="sidebar-link"><span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg></span>Certificates</a>
    <a href="/admin/messages" class="sidebar-link"><span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span>Messages</a>
    <div class="sidebar-section-label">System</div>
    <a href="/admin/settings" class="sidebar-link"><span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93l-1.41 1.41M4.93 4.93l1.41 1.41M19.07 19.07l-1.41-1.41M4.93 19.07l1.41-1.41M12 2v2M12 20v2M2 12h2M20 12h2"/></svg></span>Settings</a>
  </nav>
  <div class="sidebar-bottom"><button onclick="adminLogout()" class="btn btn-outline w-full btn-sm">Sign Out</button></div>
</aside>

<main class="main-content">
  <div class="flex-between mb-6">
    <div>
      <div style="font-size:0.76rem;color:var(--muted);margin-bottom:4px;"><a href="/admin/courses" style="color:var(--brand-secondary);">← Back to Tracks</a></div>
      <h1 style="font-size:1.5rem;font-weight:800;letter-spacing:-0.03em;">Exam Editor</h1>
      <p style="color:var(--muted);font-size:0.82rem;margin-top:3px;" id="examTrackLabel">Loading...</p>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-outline" onclick="addQuestion()">+ Add Question</button>
      <button class="btn btn-primary" onclick="saveExam()">Save Exam</button>
    </div>
  </div>

  <!-- EXAM SETTINGS -->
  <div class="card mb-6">
    <h3 style="font-size:0.88rem;font-weight:700;margin-bottom:16px;">Exam Settings</h3>
    <div class="grid-2">
      <div class="form-group"><label class="form-label">Exam Title *</label><input type="text" class="form-control" id="examTitle" placeholder="Final Assessment"/></div>
      <div class="form-group"><label class="form-label">Duration (minutes)</label><input type="number" class="form-control" id="examDuration" value="60" min="5"/></div>
    </div>
    <div class="grid-2">
      <div class="form-group"><label class="form-label">Pass Score (%)</label><input type="number" class="form-control" id="examPassScore" value="70" min="1" max="100"/></div>
      <div class="form-group"><label class="form-label">Points Reward</label><input type="number" class="form-control" id="examPoints" value="50" min="0"/></div>
    </div>
    <div class="form-group" style="margin-bottom:0;"><label class="form-label">Instructions</label><textarea class="form-control" id="examInstructions" rows="2" placeholder="Instructions shown to students before they start..."></textarea></div>
  </div>

  <!-- QUESTIONS -->
  <div class="flex-between mb-4">
    <h3 style="font-size:0.88rem;font-weight:700;">Questions <span id="qCount" style="color:var(--muted);font-weight:400;"></span></h3>
    <button class="btn btn-outline btn-sm" onclick="addQuestion()">+ Add Question</button>
  </div>

  <div id="questionsList"></div>

  <div style="margin-top:20px;display:flex;gap:10px;">
    <button class="btn btn-primary" onclick="saveExam()">Save Exam</button>
    <a href="/admin/courses" class="btn btn-outline">Back to Tracks</a>
  </div>
</main>
</div>

<script src="/js/app.js"></script>
<script src="/js/mobile.js"></script>
<script>
if (!auth.getAdminToken()) window.location.href = '/admin/login';

// Get trackId from URL query param: /admin/exam?track=UUID&name=TrackName
const params = new URLSearchParams(window.location.search);
const trackId = params.get('track');
const trackName = params.get('name') || 'Track';

if (!trackId) window.location.href = '/admin/courses';

document.getElementById('examTrackLabel').textContent = `Track: ${decodeURIComponent(trackName)}`;

let questions = [];

async function loadExam() {
  const exam = await api.get(`/api/modules/admin/exam/${trackId}`, true);
  if (exam) {
    document.getElementById('examTitle').value = exam.title || '';
    document.getElementById('examDuration').value = exam.duration_minutes || 60;
    document.getElementById('examPassScore').value = exam.pass_score || 70;
    document.getElementById('examPoints').value = exam.points_reward || 50;
    document.getElementById('examInstructions').value = exam.instructions || '';
    questions = (exam.exam_questions || []).map(q => ({
      question: q.question,
      options: q.options || ['', '', '', ''],
      correct_answer: q.correct_answer,
      points: q.points || 1
    }));
    renderQuestions();
  } else {
    // New exam defaults
    document.getElementById('examTitle').value = `${decodeURIComponent(trackName)} — Final Assessment`;
    questions = [];
    renderQuestions();
  }
}

function renderQuestions() {
  document.getElementById('qCount').textContent = `(${questions.length})`;
  const list = document.getElementById('questionsList');
  if (!questions.length) {
    list.innerHTML = `<div class="card flex-center" style="padding:40px;flex-direction:column;gap:10px;color:var(--muted);">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <p style="font-size:0.84rem;">No questions yet. Click "+ Add Question" to start.</p>
    </div>`;
    return;
  }

  list.innerHTML = questions.map((q, i) => `
    <div class="q-card animate-fade">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px;">
        <div class="q-num">Question ${i+1}</div>
        <button onclick="removeQuestion(${i})" style="background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;" title="Remove">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="form-group">
        <label class="form-label">Question Text *</label>
        <textarea class="form-control" rows="2" placeholder="Enter the question..." onchange="updateQ(${i},'question',this.value)">${q.question||''}</textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Options <span style="color:var(--muted);font-weight:400;">(click the letter to mark correct answer)</span></label>
        ${['A','B','C','D'].map((letter, oi) => `
          <div class="option-row">
            <div class="option-label ${q.correct_answer === letter ? 'correct' : ''}" onclick="setCorrect(${i},'${letter}')" title="Mark as correct">${letter}</div>
            <input type="text" class="form-control" style="flex:1;" placeholder="Option ${letter}" value="${(q.options?.[oi]||'')}" onchange="updateOption(${i},${oi},this.value)"/>
          </div>`).join('')}
        <div style="font-size:0.72rem;color:var(--muted);margin-top:4px;">
          Correct: <strong style="color:var(--brand-accent);">${q.correct_answer ? `Option ${q.correct_answer}` : 'Not set — click a letter'}</strong>
        </div>
      </div>
      <div class="form-group" style="margin-bottom:0;">
        <label class="form-label">Points for this question</label>
        <input type="number" class="form-control" style="width:120px;" value="${q.points||1}" min="1" onchange="updateQ(${i},'points',parseInt(this.value)||1)"/>
      </div>
    </div>`).join('');
}

function addQuestion() {
  questions.push({ question: '', options: ['', '', '', ''], correct_answer: '', points: 1 });
  renderQuestions();
  // Scroll to new question
  setTimeout(() => {
    const cards = document.querySelectorAll('.q-card');
    cards[cards.length-1]?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 100);
}

function removeQuestion(i) {
  questions.splice(i, 1);
  renderQuestions();
}

function updateQ(i, field, value) {
  questions[i][field] = value;
}

function updateOption(i, oi, value) {
  if (!questions[i].options) questions[i].options = ['','','',''];
  questions[i].options[oi] = value;
}

function setCorrect(i, letter) {
  questions[i].correct_answer = letter;
  renderQuestions();
}

async function saveExam() {
  const title = document.getElementById('examTitle').value.trim();
  if (!title) return showToast('Exam title is required', 'error');

  // Validate questions
  const validQ = questions.filter(q => q.question && q.correct_answer && q.options?.some(o => o));
  if (questions.length > 0 && validQ.length < questions.length) {
    const bad = questions.findIndex(q => !q.question || !q.correct_answer);
    return showToast(`Question ${bad+1} is incomplete — add question text and mark the correct answer`, 'error');
  }

  const btn = document.querySelector('button[onclick="saveExam()"]');
  btn.disabled = true; btn.textContent = 'Saving...';

  const r = await api.post('/api/modules/admin/exam', {
    track_id: trackId,
    title,
    duration_minutes: parseInt(document.getElementById('examDuration').value) || 60,
    pass_score: parseInt(document.getElementById('examPassScore').value) || 70,
    points_reward: parseInt(document.getElementById('examPoints').value) || 50,
    instructions: document.getElementById('examInstructions').value,
    questions: validQ
  }, true);

  btn.disabled = false; btn.textContent = 'Save Exam';

  if (r?.success) {
    showToast('Exam saved!', 'success');
  } else {
    showToast(r?.error || 'Failed to save exam', 'error');
  }
}

loadExam();
</script>
</body>
</html>
