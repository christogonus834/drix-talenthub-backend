<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login — Drix Tech Talent</title>
<link rel="stylesheet" href="/css/style.css"/>
<style>
body{
  display:flex;align-items:center;justify-content:center;min-height:100vh;
  position:relative;overflow:hidden;
}
/* EDIT: change this Unsplash URL for the login page background */
/* Suggested: https://images.unsplash.com/photo-1504384308090-c894fdcc538d?w=1400&q=80 */
.login-bg{
  position:fixed;inset:0;z-index:0;
  background:url('https://images.unsplash.com/photo-1504384308090-c894fdcc538d?w=1400&q=80') center/cover no-repeat;
}
.login-bg-overlay{
  position:fixed;inset:0;z-index:1;
  background:linear-gradient(135deg,rgba(11,12,16,0.92),rgba(11,12,16,0.75));
}
.login-wrap{position:relative;z-index:2;width:100%;max-width:440px;padding:20px;}
.login-card{
  background:rgba(30,31,41,0.85);
  backdrop-filter:blur(28px);
  border:1px solid var(--border2);
  border-radius:var(--rl);padding:44px;
  box-shadow:0 24px 64px rgba(0,0,0,0.5);
}
.login-logo{
  font-size:1.3rem;font-weight:800;letter-spacing:-0.02em;
  background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  display:block;text-align:center;margin-bottom:28px;
}
.divider{text-align:center;color:var(--muted2);font-size:0.76rem;margin:20px 0;position:relative;}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:44%;height:1px;background:var(--border);}
.divider::before{left:0;}.divider::after{right:0;}
</style>
</head>
<body>
<div class="login-bg"></div>
<div class="login-bg-overlay"></div>

<div class="login-wrap">
  <div class="login-card">
    <a href="/" class="login-logo">DRIX Tech Talent</a>
    <h2 style="font-size:1.5rem;margin-bottom:5px;text-align:center;">Welcome Back</h2>
    <p style="color:var(--muted);font-size:0.86rem;margin-bottom:28px;text-align:center;">Sign in to continue your learning journey</p>

    <div id="alertBox" class="alert"></div>

    <form id="loginForm">
      <div class="form-group"><label class="form-label">Email Address</label><input type="email" class="form-control" id="email" placeholder="you@example.com" required/></div>
      <div class="form-group"><label class="form-label">Password</label><input type="password" class="form-control" id="password" placeholder="Your password" required/></div>
      <div style="text-align:right;margin-bottom:22px;"><a href="/forgot-password" style="font-size:0.78rem;color:var(--accent2);">Forgot password?</a></div>
      <button type="submit" class="btn btn-primary w-full" id="loginBtn">Sign In</button>
    </form>

    <div class="divider">or</div>
    <p style="text-align:center;font-size:0.82rem;color:var(--muted);">Don't have an account? <a href="/register" style="color:var(--accent2);font-weight:600;">Apply for Fellowship</a></p>
    <p style="text-align:center;margin-top:12px;"><a href="/admin/login" style="font-size:0.76rem;color:var(--muted2);">Admin login →</a></p>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.innerHTML = '<span class="loader"></span> Signing in...';
  const box = document.getElementById('alertBox');
  box.classList.remove('show');
  const result = await api.post('/api/auth/login', {
    email: document.getElementById('email').value,
    password: document.getElementById('password').value
  });
  if (result.success) { localStorage.setItem("drix_token", result.token); window.location.href = result.redirect || "/dashboard"; }
  else {
    box.className = 'alert alert-error show'; box.textContent = result.error || 'Login failed.';
    btn.disabled = false; btn.textContent = 'Sign In';
  }
});
</script>
</body>
</html>
