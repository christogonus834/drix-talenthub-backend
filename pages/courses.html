<!-- COURSES PAGE -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Courses — Drix Tech Talent</title>
<link rel="stylesheet" href="/css/style.css"/>
<style>
.courses-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;}
.course-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;transition:var(--trans);}
.course-card:hover{border-color:rgba(124,110,247,0.3);transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,0.3);}
.course-card.done{border-color:rgba(6,214,160,0.25);}
.course-thumb{width:100%;height:130px;object-fit:cover;display:block;}
.course-thumb-fallback{width:100%;height:130px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:3rem;}
.course-body{padding:18px 20px;}
.course-title{font-size:0.92rem;font-weight:700;margin-bottom:7px;}
.course-desc{font-size:0.78rem;color:var(--muted);margin-bottom:14px;line-height:1.65;}
.course-meta{display:flex;gap:10px;font-size:0.72rem;color:var(--muted2);margin-bottom:16px;flex-wrap:wrap;}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo">DRIX Tech Talent<span>Fellow Portal</span></div>
  <nav class="sidebar-nav">
    <div class="sidebar-section-label">Main</div>
    <a href="/dashboard" class="sidebar-link"><span class="icon">🏠</span> Dashboard</a>
    <a href="/dashboard/courses" class="sidebar-link active"><span class="icon">📚</span> My Courses</a>
    <a href="/dashboard/community" class="sidebar-link"><span class="icon">👥</span> Community</a>
    <a href="/dashboard/leaderboard" class="sidebar-link"><span class="icon">🏆</span> Leaderboard</a>
  </nav>
  <div class="sidebar-bottom"><button onclick="logout()" class="btn btn-outline w-full btn-sm">← Sign Out</button></div>
</aside>
<main class="main-content">
  <div class="flex-between mb-4">
    <div><h1 style="font-size:1.5rem;letter-spacing:-0.02em;">My Courses</h1><p style="color:var(--muted);font-size:0.82rem;" id="trackLabel">Loading...</p></div>
    <div id="progressSummary" style="text-align:right;"></div>
  </div>
  <div class="card mb-6">
    <div class="flex-between mb-3"><span style="font-size:0.86rem;font-weight:600;">Track Progress</span><span id="pctLabel" style="font-size:0.86rem;color:var(--accent2);">0%</span></div>
    <div class="progress-bar"><div class="progress-fill" id="pBar" style="width:0%"></div></div>
  </div>
  <div class="courses-grid" id="coursesGrid"><div style="grid-column:span 3;text-align:center;padding:60px;"><span class="loader"></span></div></div>
</main>
<script src="/js/app.js"></script>
<script>
// ── FELLOW TOKEN GUARD ────────────────────────────────────────────
if (!localStorage.getItem('drix_token')) {
  window.location.href = '/login';
}

</script>
<script>
const typeIcons={video:'🎥',article:'📄',pdf:'📋',quiz:'📝',project:'🛠️'};
async function load(){
  const [courses,me]=await Promise.all([api.get('/api/fellows/courses'),api.get('/api/fellows/me')]);
  document.getElementById('trackLabel').textContent=`Track: ${me?.fellow?.tracks?.name||'—'}`;
  const grid=document.getElementById('coursesGrid');
  if(!courses?.length){grid.innerHTML='<div class="empty-state" style="grid-column:span 3;"><div class="icon">📚</div><p>No courses added to your track yet.</p></div>';return;}
  const done=courses.filter(c=>c.progress?.completed).length;
  const pct=Math.round((done/courses.length)*100);
  document.getElementById('pctLabel').textContent=pct+'%';
  document.getElementById('pBar').style.width=pct+'%';
  document.getElementById('progressSummary').innerHTML=`<div style="font-size:0.82rem;color:var(--muted);">${done}/${courses.length} completed</div>`;
  grid.innerHTML=courses.map(c=>`
    <div class="course-card ${c.progress?.completed?'done':''}">
      <div class="course-thumb-fallback">${typeIcons[c.resource_type]||'📖'}</div>
      <div class="course-body">
        <div class="course-title">${c.title}</div>
        <div class="course-desc">${c.description||'No description available.'}</div>
        <div class="course-meta"><span>⏱ ${c.duration_minutes} min</span><span>📂 ${c.resource_type}</span>${c.progress?.completed?`<span style="color:var(--success);">✓ Completed ${formatDate(c.progress.completed_at)}</span>`:''}</div>
        <div style="display:flex;gap:9px;flex-wrap:wrap;">
          ${c.content_url?`<a href="${c.content_url}" target="_blank" class="btn btn-outline btn-sm">Open →</a>`:''}
          ${!c.progress?.completed?`<button class="btn btn-primary btn-sm" onclick="markDone('${c.id}',this)">Mark Complete (+10 pts)</button>`:'<span style="color:var(--success);font-size:0.82rem;font-weight:600;">✅ Completed</span>'}
        </div>
      </div>
    </div>`).join('');
}
async function markDone(id,btn){
  btn.disabled=true;btn.innerHTML='<span class="loader"></span>';
  const r=await api.post(`/api/fellows/courses/${id}/complete`,{});
  if(r.success){showToast('Course completed! +10 points 🎉','success');load();}
  else{showToast('Failed.','error');btn.disabled=false;btn.textContent='Mark Complete (+10 pts)';}
}
load();
</script>
</body>
</html>
