<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Check-ins — Drix Admin</title>
<link rel="stylesheet" href="/css/style.css"/>
<style>
.warn-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:14px 18px;margin-bottom:8px;display:flex;align-items:center;gap:14px;}
.warn-row.help{border-color:rgba(244,63,94,0.3);background:rgba(244,63,94,0.04);}
.warn-row.low{border-color:rgba(251,191,36,0.3);background:rgba(251,191,36,0.04);}
.warn-row.missed{border-color:rgba(124,110,247,0.25);background:rgba(124,110,247,0.04);}
.conf-pill{font-weight:700;font-size:0.78rem;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tab-bar{display:flex;gap:8px;margin-bottom:18px;}
.week-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:14px 18px;margin-bottom:8px;display:flex;align-items:center;gap:14px;}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
  <div class="sidebar-logo">DRIX Admin<span>Management Portal</span></div>
  <nav class="sidebar-nav">
    <div class="sidebar-section-label">Overview</div>
    <a href="/admin/dashboard" class="sidebar-link"><span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span>Dashboard</a>
    <a href="/admin/fellows" class="sidebar-link"><span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></span>Fellows</a>
    <a href="/admin/mentors" class="sidebar-link"><span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>Mentors</a>
    <a href="/admin/checkins" class="sidebar-link active"><span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span>Check-ins</a>
    <div class="sidebar-section-label">Content</div>
    <a href="/admin/courses" class="sidebar-link"><span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>Tracks & Modules</a>
    <a href="/admin/cohorts" class="sidebar-link"><span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>Cohorts</a>
    <a href="/admin/announcements" class="sidebar-link"><span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l18-5v12L3 14v-3z"/></svg></span>Announcements</a>
    <a href="/admin/submissions" class="sidebar-link"><span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span>Submissions</a>
    <a href="/admin/messages" class="sidebar-link"><span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span>Messages</a>
    <div class="sidebar-section-label">System</div>
    <a href="/admin/settings" class="sidebar-link"><span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg></span>Settings</a>
  </nav>
  <div class="sidebar-bottom"><button onclick="adminLogout()" class="btn btn-outline w-full btn-sm">Sign Out</button></div>
</aside>

<main class="main-content">
  <div class="mb-6"><h1 style="font-size:1.5rem;font-weight:800;letter-spacing:-0.03em;">Weekly Check-ins</h1><p style="color:var(--muted);font-size:0.82rem;margin-top:3px;">Confidence, hours studied, and who needs help</p></div>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="showView('warnings', this)">⚠️ Early Warning</button>
    <button class="tab-btn" onclick="showView('week', this)">This Week's Check-ins</button>
  </div>

  <div id="view-warnings">
    <div class="grid-3 mb-6" id="warnStats"></div>
    <div id="warnLists"><div class="flex-center" style="padding:40px;"><span class="loader"></span></div></div>
  </div>

  <div id="view-week" style="display:none;">
    <div class="flex-between mb-4">
      <span id="weekSubmittedLabel" style="font-size:0.82rem;color:var(--muted);"></span>
    </div>
    <div id="weekList"><div class="flex-center" style="padding:40px;"><span class="loader"></span></div></div>
  </div>
</main>
</div>

<script src="/js/app.js"></script>
<script src="/js/mobile.js"></script>
<script>
if (!auth.getAdminToken()) window.location.href = '/admin/login';
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function showView(name, btn) {
  document.getElementById('view-warnings').style.display = name === 'warnings' ? '' : 'none';
  document.getElementById('view-week').style.display = name === 'week' ? '' : 'none';
  document.querySelectorAll('.tab-bar .tab-btn').forEach(b => b.classList.remove('active'));
  btn?.classList.add('active');
  if (name === 'warnings') loadWarnings(); else loadWeek();
}

async function loadWarnings() {
  const w = await api.get('/api/admin/checkins/warnings', true);
  if (!w) return;
  document.getElementById('warnStats').innerHTML = `
    <div class="stat-card"><div class="stat-value" style="color:var(--brand-danger);">${w.flagged_help.length}</div><div class="stat-label">🚩 Flagged for help</div></div>
    <div class="stat-card"><div class="stat-value" style="color:#FBBF24;">${w.low_confidence.length}</div><div class="stat-label">Low confidence (≤2)</div></div>
    <div class="stat-card"><div class="stat-value" style="color:var(--brand-secondary);">${w.missed_checkins.length}</div><div class="stat-label">Missed 2 weeks running</div></div>`;

  const section = (title, rows, cls, renderExtra) => !rows.length ? '' : `
    <div style="font-weight:700;font-size:0.9rem;margin:18px 0 10px;">${title}</div>
    ${rows.map(r => `
      <div class="warn-row ${cls}">
        <div class="avatar">${r.fellows?.profile_photo ? `<img src="${r.fellows.profile_photo}"/>` : esc(r.fellows?.full_name?.charAt(0)||'?')}</div>
        <div style="flex:1;">
          <div style="font-weight:700;font-size:0.86rem;">${esc(r.fellows?.full_name||'Unknown')}</div>
          <div style="font-size:0.74rem;color:var(--muted);">${esc(r.fellows?.email||'')} · ${esc(r.fellows?.tracks?.name||'')}</div>
          ${r.note ? `<div style="font-size:0.78rem;color:var(--text2);margin-top:6px;background:var(--bg3);padding:8px 10px;border-radius:6px;">"${esc(r.note)}"</div>` : ''}
        </div>
        ${renderExtra ? renderExtra(r) : ''}
      </div>`).join('')}`;

  document.getElementById('warnLists').innerHTML =
    section('🚩 Flagged for help this week', w.flagged_help, 'help', r => `<a href="/admin/fellows" class="btn btn-outline btn-sm">View</a>`) +
    section('Low confidence this week', w.low_confidence, 'low', r => `<span class="conf-pill" style="background:rgba(251,191,36,0.15);color:#FBBF24;">${r.confidence_rating}</span>`) +
    section('No check-in for 2 weeks', w.missed_checkins, 'missed') ||
    `<div class="empty-state"><h3>All clear 🎉</h3><p>No one is flagged this week.</p></div>`;
}

async function loadWeek() {
  const r = await api.get('/api/admin/checkins', true);
  if (!r) return;
  document.getElementById('weekSubmittedLabel').textContent = `Week of ${r.week_start} · ${r.submitted}/${r.total_approved} submitted`;
  const el = document.getElementById('weekList');
  if (!r.checkins.length) { el.innerHTML = `<div class="empty-state"><p>No check-ins submitted yet this week.</p></div>`; return; }
  const confColor = c => c >= 4 ? '#06D6A0' : c === 3 ? 'var(--brand-secondary)' : '#F43F5E';
  el.innerHTML = r.checkins.map(c => `
    <div class="week-row">
      <div class="avatar">${c.fellows?.profile_photo ? `<img src="${c.fellows.profile_photo}"/>` : esc(c.fellows?.full_name?.charAt(0)||'?')}</div>
      <div style="flex:1;">
        <div style="font-weight:700;font-size:0.86rem;">${esc(c.fellows?.full_name||'Unknown')} ${c.needs_help ? '🚩' : ''}</div>
        <div style="font-size:0.74rem;color:var(--muted);">${esc(c.fellows?.tracks?.name||'')} · ${c.hours_studied}h studied</div>
      </div>
      <span class="conf-pill" style="background:rgba(255,255,255,0.06);color:${confColor(c.confidence_rating)};">${c.confidence_rating}</span>
    </div>`).join('');
}

loadWarnings();
</script>
</body>
</html>
