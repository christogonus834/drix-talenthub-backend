<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Verify Certificate — Drix Tech Talent</title>
<link rel="stylesheet" href="/css/style.css"/>
<style>
body{min-height:100vh;display:flex;flex-direction:column;}
/* EDIT: Change this URL for the verify page background */
.verify-bg{position:fixed;inset:0;z-index:0;background:url('https://images.unsplash.com/photo-1523240795612-9a054b0db644?w=1400&q=80') center/cover no-repeat;}
.verify-bg-ov{position:fixed;inset:0;z-index:1;background:rgba(11,12,16,0.88);}
.verify-main{position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center;padding:120px 20px 60px;flex-direction:column;}
.verify-card{width:100%;max-width:560px;}
#certHost{width:100%;max-width:1000px;margin-top:28px;}
#certHost:empty{display:none;}
.result-box{display:none;background:rgba(30,31,41,0.9);backdrop-filter:blur(20px);border:1px solid var(--border2);border-radius:var(--rl);overflow:hidden;margin-top:0;}
.result-box.show{display:block;}
.result-head{padding:30px;text-align:center;border-bottom:1px solid var(--border);}
.valid-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 18px;border-radius:50px;font-weight:700;font-size:0.78rem;text-transform:uppercase;letter-spacing:0.07em;}
.valid-chip.ok{background:rgba(6,214,160,0.12);color:var(--success);border:1px solid rgba(6,214,160,0.28);}
.valid-chip.fail{background:rgba(244,63,94,0.12);color:var(--danger);border:1px solid rgba(244,63,94,0.28);}
.result-body{padding:28px;}
.cf{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.04);}
.cf:last-child{border-bottom:none;}
.cf-label{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--muted2);}
.cf-val{font-weight:600;font-size:0.88rem;text-align:right;max-width:60%;}
.cert-id-chip{font-family:monospace;font-size:1rem;color:var(--accent2);background:rgba(124,110,247,0.08);border:1px solid rgba(124,110,247,0.2);padding:10px 18px;border-radius:var(--r);letter-spacing:0.1em;text-align:center;margin-bottom:22px;}
/* CERTIFICATE PREVIEW DESIGN */
.cert-preview{margin-top:24px;border:2px solid rgba(124,110,247,0.25);border-radius:var(--rl);padding:36px;text-align:center;background:linear-gradient(135deg,rgba(124,110,247,0.04),rgba(167,139,250,0.02));position:relative;overflow:hidden;}
.cert-preview::before{content:'';position:absolute;inset:8px;border:1px solid rgba(255,255,255,0.04);border-radius:14px;pointer-events:none;}
.cert-wm{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-30deg);font-size:5rem;opacity:0.025;font-weight:900;pointer-events:none;white-space:nowrap;}
.cert-org{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.18em;color:var(--muted2);margin-bottom:14px;}
.cert-hl{font-size:0.88rem;color:var(--muted);margin-bottom:8px;}
.cert-name{font-size:2rem;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;letter-spacing:-0.02em;}
.cert-photo{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid rgba(124,110,247,0.4);margin:0 auto 14px;display:block;}
.cert-track-line{font-size:0.84rem;color:var(--muted);margin-bottom:8px;}
.cert-track{font-size:1.2rem;font-weight:700;margin-bottom:18px;}
.cert-div{height:1px;background:linear-gradient(90deg,transparent,rgba(124,110,247,0.35),transparent);margin:18px 0;}
.cert-grade{display:inline-block;padding:5px 18px;border-radius:50px;background:rgba(6,214,160,0.1);border:1px solid rgba(6,214,160,0.25);color:var(--success);font-weight:700;font-size:0.8rem;margin-bottom:12px;}
.cert-footer{font-size:0.72rem;color:var(--muted2);}
</style>
</head>
<body>
<div class="verify-bg"></div>
<div class="verify-bg-ov"></div>

<nav class="navbar" style="z-index:10;">
  <a href="/" class="nav-logo">DRIX<span> Tech Talent</span></a>
  <div class="nav-links"><a href="/">Home</a><a href="/login">Login</a><a href="/register" class="btn btn-primary btn-sm">Apply</a></div>
</nav>

<div class="verify-main">
  <div class="verify-card">
    <div style="text-align:center;margin-bottom:32px;">
      <div style="font-size:2.8rem;margin-bottom:10px;">🔍</div>
      <h1 style="font-size:1.7rem;margin-bottom:8px;letter-spacing:-0.02em;">Certificate Verification</h1>
      <p style="color:var(--muted);font-size:0.88rem;">Enter the unique certificate ID from your hardcopy certificate to verify authenticity.</p>
    </div>

    <div style="display:flex;gap:11px;margin-bottom:24px;">
      <input type="text" class="form-control" id="certInput" placeholder="e.g. DRIX-CERT-2025-KX7B2A" style="font-family:monospace;letter-spacing:0.05em;text-transform:uppercase;flex:1;" oninput="this.value=this.value.toUpperCase()"/>
      <button class="btn btn-primary" onclick="verifyCert()">Verify</button>
    </div>

    <div class="result-box" id="resultBox">
      <div class="result-head">
        <div style="font-size:2.8rem;margin-bottom:10px;" id="rIcon">🔍</div>
        <div class="valid-chip" id="rChip"></div>
        <div style="margin-top:10px;font-size:0.82rem;color:var(--muted);" id="rMsg"></div>
      </div>
      <div class="result-body" id="rBody"></div>
    </div>
  </div>
  <div id="certHost"></div>
</div>

<footer style="position:relative;z-index:2;border-top:1px solid var(--border);padding:22px 56px;display:flex;justify-content:space-between;color:var(--muted);font-size:0.78rem;flex-wrap:wrap;gap:12px;">
  <span>Drix Tech Foundation © 2026 · Sponsored by ePayBillz Telecomm</span>
  <a href="/" style="color:var(--muted);">← Back to Home</a>
</footer>

<script src="/js/app.js"></script>
<script src="/js/qr.js"></script>
<script src="/js/certificate.js"></script>
<script>
const E=v=>String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const params=new URLSearchParams(window.location.search);
if(params.get('id')){document.getElementById('certInput').value=params.get('id').toUpperCase();verifyCert();}

async function verifyCert(){
  const id=document.getElementById('certInput').value.trim();
  if(!id||id.length<5){showToast('Please enter a valid certificate ID.','error');return;}
  const box=document.getElementById('resultBox');
  box.classList.add('show');
  document.getElementById('certHost').innerHTML='';
  document.getElementById('rIcon').textContent='⏳';
  document.getElementById('rChip').className='valid-chip';
  document.getElementById('rChip').textContent='Checking...';
  document.getElementById('rMsg').textContent='';
  document.getElementById('rBody').innerHTML='<div style="text-align:center;padding:20px;"><span class="loader"></span></div>';

  const res=await fetch(`${API_BASE}/api/certificates/verify/${encodeURIComponent(id)}`).then(r=>r.json()).catch(()=>null);

  if(res?.valid){
    const c=res.certificate;
    const branding=await DrixCertificate.loadBranding();
    document.getElementById('rIcon').textContent='✅';
    document.getElementById('rChip').className='valid-chip ok';
    document.getElementById('rChip').textContent='✓ Verified — Authentic Certificate';
    document.getElementById('rMsg').textContent='This certificate is genuine and was issued by Drix Tech Foundation.';
    document.getElementById('rBody').innerHTML=`
      <div class="cert-id-chip">${E(c.certificate_id)}</div>
      ${[['Fellow Name',E(c.fellow_name)],['Fellow ID',`<span style="font-family:monospace;color:var(--accent2);">${E(c.fellow_id)||'—'}</span>`],['Track Completed',`${E(c.track_icon)} ${E(c.track)}`],['Certificate Title',E(c.title)],['Grade',`<span style="color:var(--success);font-weight:700;">${E(c.grade)||'Pass'}</span>`],['State',E(c.state)||'—'],['Date Issued',formatDate(c.issued_at)],['Issued By',c.issued_manually?'Admin (Manual)':'System (Auto-generated)']].map(([l,v])=>`<div class="cf"><span class="cf-label">${l}</span><span class="cf-val">${v}</span></div>`).join('')}
    `;
    document.getElementById('certHost').innerHTML=`
      <div>${DrixCertificate.render({
        fellowName:c.fellow_name, photo:c.fellow_photo, trackName:c.track, title:c.title, grade:c.grade, score:c.score,
        certId:c.certificate_id, issuedAt:c.issued_at,
        sig1_name:c.sig1_name, sig1_logo:c.sig1_logo, sig2_name:c.sig2_name, sig2_logo:c.sig2_logo, logoUrl:branding.logo
      })}</div>
      <div style="margin-top:18px;text-align:center;"><button class="btn btn-outline btn-sm" onclick="DrixCertificate.print(document.querySelector('#certHost .drx-cert-wrap'))">🖨️ Print / Save PDF</button></div>
    `;
    DrixCertificate.fit(document.getElementById('certHost'));
  } else {
    document.getElementById('rIcon').textContent='❌';
    document.getElementById('rChip').className='valid-chip fail';
    document.getElementById('rChip').textContent='✗ Invalid Certificate';
    document.getElementById('rMsg').textContent=res?.error||'This ID was not found in our records.';
    document.getElementById('rBody').innerHTML=`<div style="text-align:center;padding:20px;"><p style="color:var(--muted);font-size:0.86rem;margin-bottom:12px;">The ID <strong style="font-family:monospace;color:var(--danger);">${E(id)}</strong> does not match any certificate.</p><p style="color:var(--muted2);font-size:0.8rem;">Double-check the ID on your hardcopy certificate and try again.</p></div>`;
  }
}
document.getElementById('certInput').addEventListener('keypress',e=>{if(e.key==='Enter')verifyCert();});
</script>
</body>
</html>
