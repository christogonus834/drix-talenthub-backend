<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Messages — Drix Tech Talent</title>
<link rel="stylesheet" href="/css/style.css"/>
<style>
.msg-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:20px 24px;margin-bottom:12px;cursor:pointer;transition:var(--trans);}
.msg-card:hover{border-color:var(--border3);transform:translateY(-1px);}
.msg-card.unread{border-left:3px solid var(--brand-primary);}
.reply-item{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-top:10px;}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
  <div class="sidebar-logo">DRIX Tech Talent<span>Fellow Portal</span></div>
  <nav class="sidebar-nav">
    <div class="sidebar-section-label">Main</div>
    <a href="/dashboard" class="sidebar-link"><span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span>Dashboard</a>
    <a href="/dashboard/courses" class="sidebar-link"><span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>My Courses</a>
    <a href="/dashboard/community" class="sidebar-link"><span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>Community</a>
    <a href="/dashboard/leaderboard" class="sidebar-link"><span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg></span>Leaderboard</a>
    <div class="sidebar-section-label">Account</div>
    <a href="/dashboard/certificates" class="sidebar-link"><span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg></span>Certificates</a>
    <a href="/dashboard/messages" class="sidebar-link active"><span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span>Messages</a>
    <a href="/dashboard/profile" class="sidebar-link"><span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>My Profile</a>
  </nav>
  <div class="sidebar-bottom"><button onclick="logout()" class="btn btn-outline w-full btn-sm">Sign Out</button></div>
</aside>

<main class="main-content">
  <div class="flex-between mb-6">
    <div><h1 style="font-size:1.5rem;font-weight:800;letter-spacing:-0.03em;">Messages</h1><p style="color:var(--muted);font-size:0.82rem;margin-top:3px;">Contact admin and view replies</p></div>
    <button class="btn btn-primary" onclick="openModal('newMsgModal')">
      <span class="icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span>
      New Message
    </button>
  </div>

  <div id="msgsList"><div class="flex-center" style="padding:60px;"><span class="loader"></span></div></div>
</main>
</div>

<!-- NEW MESSAGE MODAL -->
<div class="modal-overlay" id="newMsgModal">
  <div class="modal" style="max-width:480px;">
    <div class="modal-header">
      <div class="modal-title">Send Message to Admin</div>
      <button class="modal-close" onclick="closeModal('newMsgModal')">✕</button>
    </div>
    <div class="form-group" id="toGroup" style="display:none;">
      <label class="form-label">Send to</label>
      <select class="form-control" id="msgTo">
        <option value="admin">Admin</option>
        <option value="mentor">Your Mentor</option>
      </select>
    </div>
    <div class="form-group"><label class="form-label">Subject</label><input type="text" class="form-control" id="msgSubject" placeholder="e.g. Question about my course"/></div>
    <div class="form-group"><label class="form-label">Message *</label><textarea class="form-control" id="msgBody" rows="5" placeholder="Type your message here..."></textarea></div>
    <div style="display:flex;gap:10px;margin-top:8px;">
      <button class="btn btn-primary" onclick="sendMessage()">
        <span class="icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></span>
        Send Message
      </button>
      <button class="btn btn-outline" onclick="closeModal('newMsgModal')">Cancel</button>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/mobile.js"></script>
<script>
if (!auth.getToken()) window.location.href = '/login';
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

let hasMentor = false;
(async () => {
  const me = await api.get('/api/fellows/me');
  hasMentor = !!me?.fellow?.mentors;
  if (hasMentor) document.getElementById('toGroup').style.display = '';
  const params = new URLSearchParams(window.location.search);
  if (params.get('to') === 'mentor' && hasMentor) {
    document.getElementById('msgTo').value = 'mentor';
    openModal('newMsgModal');
  }
})();

async function loadMessages() {
  const msgs = await api.get('/api/messages/my');
  const container = document.getElementById('msgsList');
  if (!msgs?.length) {
    container.innerHTML = `
      <div class="empty-state">
        <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        <h3>No messages yet</h3>
        <p>Send a message to admin for support or enquiries</p>
        <button class="btn btn-primary" style="margin-top:16px;" onclick="openModal('newMsgModal')">Send First Message</button>
      </div>`;
    return;
  }

  container.innerHTML = msgs.map(m => `
    <div class="msg-card ${m.status==='unread'?'unread':''}">
      <div class="flex-between mb-3">
        <div>
          <div style="font-weight:700;font-size:0.9rem;">${esc(m.subject)} ${m.recipient_type==='mentor' ? '<span class="badge badge-info" style="margin-left:6px;">To: Mentor</span>' : ''}</div>
          <div style="font-size:0.72rem;color:var(--muted);margin-top:2px;">${formatDate(m.sent_at)}</div>
        </div>
        <span class="badge badge-${m.status==='replied'?'approved':m.status==='read'?'info':'pending'}">${m.status}</span>
      </div>
      <div style="font-size:0.83rem;color:var(--text2);padding:12px 14px;background:var(--bg3);border-radius:8px;line-height:1.7;">${esc(m.message)}</div>

      ${(m.message_replies||[]).length > 0 ? `
        <div style="margin-top:14px;">
          <div style="font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--brand-accent);margin-bottom:8px;">${m.recipient_type==='mentor' ? 'Mentor Reply' : 'Admin Reply'}</div>
          ${m.message_replies.map(r => `
            <div class="reply-item">
              <div style="font-size:0.76rem;color:var(--muted2);margin-bottom:6px;">${r.mentor_id ? 'Mentor' : 'Admin'} · ${formatDate(r.replied_at)}</div>
              <div style="font-size:0.83rem;line-height:1.7;">${esc(r.reply)}</div>
            </div>`).join('')}
        </div>` : ''}
    </div>`).join('');
}

async function sendMessage() {
  const subject = document.getElementById('msgSubject').value.trim();
  const message = document.getElementById('msgBody').value.trim();
  const to = hasMentor ? document.getElementById('msgTo').value : 'admin';
  if (!message) return showToast('Please type a message', 'error');

  const r = await api.post('/api/messages/send', { subject: subject || (to==='mentor'?'Message to mentor':'General Enquiry'), message, to });
  if (r?.success) {
    showToast('Message sent!', 'success');
    closeModal('newMsgModal');
    document.getElementById('msgSubject').value = '';
    document.getElementById('msgBody').value = '';
    loadMessages();
  } else {
    showToast(r?.error || 'Failed to send', 'error');
  }
}

loadMessages();
</script>
</body>
</html>
